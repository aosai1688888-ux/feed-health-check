map $host $feed_robots_tag {
    default "noindex";
    feed.qianwuai.com "";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag $feed_robots_tag always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.paddle.com; style-src 'self'; img-src 'self' data: https:; frame-src https://*.paddle.com https://*.paddle.net; connect-src https:; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = / { try_files /index.html =404; }
    location ~* ^/(app\.js|first-payment\.js|checkout-config\.v1\.json|first-payment-offer\.v1\.json)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
}
