name: FeedHealth Paddle Sandbox Isolated Smoke V1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sandbox QA only: reserve original Group SoR test order and verify Paddle"
        required: true
        type: choice
        options:
          - overlay_probe
          - official_test_card
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paddle-sandbox-smoke-v1.yml'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'feedhealth-proxy.template'
      - 'scripts/40-feedhealth-transport.sh'
      - 'first-payment.js'
      - 'checkout-config.v1.json'
      - 'scripts/create-paddle-sandbox-config-v1.py'
      - 'scripts/test-paddle-sandbox-contract-v1.cjs'
      - 'scripts/test-paddle-sandbox-first-order-qa.cjs'

permissions:
  contents: read

jobs:
  sandbox-qa-source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          node --check scripts/test-paddle-sandbox-first-order-qa.cjs
          node --test scripts/test-paddle-sandbox-contract-v1.cjs
          echo "SANDBOX_QA_NO_PAYMENT_CONTRACT=PASS"

  sandbox-qa-official:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    concurrency:
      group: feedhealth-official-sandbox-qa-one-at-a-time
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify original public production checkout remains closed
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test-paddle-sandbox-first-order-qa.cjs
          python3 scripts/verify-first-payment-v1.py
          python3 - <<'PY'
          import json,urllib.request
          url="https://feed.qianwuai.com/checkout-config.v1.json"
          with urllib.request.urlopen(url,timeout=12) as response:
              d=json.load(response)
          assert d.get("enabled") is False and d.get("provider")=="UNBOUND"
          print("PUBLIC_LIVE_AND_SANDBOX_CHECKOUT_STILL_CLOSED=PASS")
          PY
      - name: Generate one isolated official Sandbox QA config from original credentials
        shell: bash
        env:
          FEEDHEALTH_PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.FEEDHEALTH_PADDLE_SANDBOX_CLIENT_TOKEN }}
          FEEDHEALTH_PADDLE_SANDBOX_PRICE_ID: ${{ vars.FEEDHEALTH_PADDLE_SANDBOX_PRICE_ID }}
          FEEDHEALTH_PADDLE_SANDBOX_PRODUCT_ID: ${{ vars.FEEDHEALTH_PADDLE_SANDBOX_PRODUCT_ID }}
          FEEDHEALTH_SANDBOX_QA_ADMITTED: "YES"
          FEEDHEALTH_SANDBOX_DELIVERY_VERIFIED: "NO"
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/create-paddle-sandbox-config-v1.py --output "$RUNNER_TEMP/feedhealth-sandbox-qa.json" >/dev/null
          python3 - "$RUNNER_TEMP/feedhealth-sandbox-qa.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["environment"]=="sandbox" and d["production_authorization"]=="DENIED"
          assert d["fulfillment_status"]=="SANDBOX_QA_DELIVERY_UNPROVEN"
          assert d["fulfillment"]["status"]=="SANDBOX_QA_READY"
          assert d["paddle"]["client_side_token"].startswith("test_")
          print("ORIGINAL_PROVIDER_SANDBOX_CLIENT_CONFIG_IN_EPHEMERAL_RUNNER=PASS")
          PY
      - name: Install isolated browser runner (no artifacts or screenshots uploaded)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run one real Paddle Sandbox browser acceptance attempt
        shell: bash
        env:
          FEEDHEALTH_QA_MODE: ${{ inputs.mode }}
          FEEDHEALTH_QA_CONFIG: ${{ runner.temp }}/feedhealth-sandbox-qa.json
        run: |
          set -euo pipefail
          node scripts/test-paddle-sandbox-first-order-qa.cjs
      - name: Destroy ephemeral public token copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/feedhealth-sandbox-qa.json"

  sandbox-smoke:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/feedhealth-paddle-sandbox-candidate-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate with no persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify source and zero-payment boundary
        run: |
          set -euo pipefail
          python3 scripts/verify-first-payment-v1.py >/dev/null
          node --test scripts/test-paddle-sandbox-contract-v1.cjs >/dev/null
          node --test scripts/test-diagnostic-score-truth-v1.cjs >/dev/null
          python3 scripts/verify-railway-migration-v1.py >/dev/null
          echo "PADDLE_SANDBOX_STATIC_AND_REGRESSIONS=PASS"

      - name: Bind real public Sandbox token and ID values inside ephemeral CI runner
        env:
          FEEDHEALTH_PADDLE_SANDBOX_CLIENT_TOKEN: ${{ secrets.FEEDHEALTH_PADDLE_SANDBOX_CLIENT_TOKEN }}
          FEEDHEALTH_PADDLE_SANDBOX_PRODUCT_ID: ${{ vars.FEEDHEALTH_PADDLE_SANDBOX_PRODUCT_ID }}
          FEEDHEALTH_PADDLE_SANDBOX_PRICE_ID: ${{ vars.FEEDHEALTH_PADDLE_SANDBOX_PRICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          STAGE="$(mktemp -d)"
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"
          python3 scripts/create-paddle-sandbox-config-v1.py --output "$STAGE/checkout-config.v1.json" >/dev/null
          python3 - "$STAGE/checkout-config.v1.json" <<'PY'
          import json,os,sys,stat
          from pathlib import Path
          source=json.loads(Path("checkout-config.v1.json").read_text())
          stage=json.loads(Path(sys.argv[1]).read_text())
          assert source["enabled"] is False and source["provider"]=="UNBOUND"
          assert stage["enabled"] is True and stage["provider"]=="PADDLE"
          assert stage["environment"]=="sandbox" and stage["sandbox_test_purchase_only"] is True
          assert stage["production_authorization"]=="DENIED"
          assert stage["paddle"]["client_side_token"]==os.environ["FEEDHEALTH_PADDLE_SANDBOX_CLIENT_TOKEN"]
          assert stage["paddle"]["price_id"]==os.environ["FEEDHEALTH_PADDLE_SANDBOX_PRICE_ID"]
          assert stage["paddle"]["product_id"]==os.environ["FEEDHEALTH_PADDLE_SANDBOX_PRODUCT_ID"]
          assert stat.S_IMODE(Path(sys.argv[1]).stat().st_mode)==0o600
          print("REAL_PADDLE_SANDBOX_ACCOUNT_BINDING=PASS")
          print("LIVE_PAYMENT_AUTHORITY=UNCHANGED_DENIED")
          PY

      - name: Test ephemeral local runtime without provider mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR/scripts"
          cp scripts/40-feedhealth-transport.sh "$STAGE_DIR/scripts/"
          cp Dockerfile nginx.conf feedhealth-proxy.template index.html app.js first-payment.js first-payment.css first-payment-offer.v1.json styles.css collector.css privacy.html terms.html contact.html pricing.html refund.html robots.txt sitemap.xml "$STAGE_DIR/"
          # Only the isolated HTTP localhost smoke fixture may read local JSON over http.
          # Never modify the original production CSP to permit insecure origins.
          python3 - "$STAGE_DIR/nginx.conf" "$STAGE_DIR/index.html" <<'PY_CSP'
          import sys
          from pathlib import Path
          for fn in sys.argv[1:]:
              p=Path(fn)
              text=p.read_text()
              assert text.count("connect-src https:;")==1
              p.write_text(text.replace("connect-src https:;","connect-src https: http://127.0.0.1:18091;"))
          print("STAGING_ONLY_LOCALHOST_CSP_ALLOWLIST=PASS")
          PY_CSP
          docker build --quiet -t feedhealth-sandbox-ephemeral:ci "$STAGE_DIR" >/dev/null
          docker run -d --rm --name feedhealth-sandbox-ephemeral-ci -p 127.0.0.1:18091:8080 feedhealth-sandbox-ephemeral:ci >/dev/null
          trap 'docker stop feedhealth-sandbox-ephemeral-ci >/dev/null 2>&1 || true; rm -rf "$STAGE_DIR"' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18091/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:18091/healthz
          curl -fsS http://127.0.0.1:18091/checkout-config.v1.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["provider"]=="PADDLE" and d["environment"]=="sandbox" and d["production_authorization"]=="DENIED"; print("ISOLATED_SANDBOX_HTTP_CONFIG=PASS")'
          curl -fsS -o /dev/null http://127.0.0.1:18091/
          curl -fsSI http://127.0.0.1:18091/ | grep -qi 'x-robots-tag: noindex'
          echo "PADDLE_SANDBOX_EPHEMERAL_STATIC_GATE=PASS"
          # A genuine provider PRICE PREVIEW via Paddle.js/Chromium; never open checkout or charge.
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
          FEEDHEALTH_SANDBOX_SMOKE_URL=http://127.0.0.1:18091/ node scripts/test-paddle-browser-price-preview-v1.cjs
          echo "NO_SANDBOX_TRANSACTION_OR_REPORT_DELIVERY_ASSERTED"
